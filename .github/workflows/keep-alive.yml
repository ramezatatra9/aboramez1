name: Keep Supabase Alive 🔄

on:
  schedule:
    - cron: '0 10 */5 * *'  # كل 5 أيام الساعة 10 صباحاً
  workflow_dispatch:         # تشغيل يدوي عند الحاجة

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase to prevent pausing
        run: |
          echo "🔄 Pinging Supabase..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://cvctvekiqgvgpwerzzex.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2Y3R2ZWtpcWd2Z3B3ZXJ6emV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDIzMDUsImV4cCI6MjEwNTU3ODMwNX0.g8RGA0_xVv4Gkzv6QRQ5ccH9gcaMQzeBmVpN1Dc5v2U" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2Y3R2ZWtpcWd2Z3B3ZXJ6emV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDIzMDUsImV4cCI6MjEwNTU3ODMwNX0.g8RGA0_xVv4Gkzv6QRQ5ccH9gcaMQzeBmVpN1Dc5v2U")
          
          echo "📡 Response Code: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Supabase is alive and running!"
          else
            echo "⚠️ Unexpected response: $RESPONSE"
          fi
