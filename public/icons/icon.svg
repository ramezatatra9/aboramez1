<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Card Glow / Inner Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base (Full Bleed for Maskable & Normal) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Circles -->
  <circle cx="430" cy="90" r="160" fill="#ffffff" opacity="0.06"/>
  <circle cx="70" cy="440" r="140" fill="#000000" opacity="0.12"/>

  <!-- Inner Badge / Card -->
  <g filter="url(#shadow)">
    <!-- Main Store / POS Device Shape -->
    <!-- Shopping Bag with POS Terminal Accents -->
    <!-- Handle -->
    <path d="M 196 170 C 196 110, 316 110, 316 170" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <rect x="120" y="165" width="272" height="255" rx="36" fill="#ffffff" filter="url(#badgeShadow)"/>
    
    <!-- Top Notch of Bag -->
    <path d="M 120 220 L 392 220" stroke="#f1f5f9" stroke-width="3"/>
    
    <!-- Receipt / Card Coming Out of Top -->
    <rect x="186" y="125" width="140" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <line x1="210" y1="145" x2="302" y2="145" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="160" x2="275" y2="160" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Gold Accent Star / Sparkle in Top Right of Bag -->
    <circle cx="360" cy="195" r="12" fill="url(#goldGrad)"/>

    <!-- Central Icon on Bag: Barcode + Shopping Cart / Check -->
    <!-- Stylized Barcode Lines -->
    <g transform="translate(160, 240)">
      <rect x="0" y="0" width="8" height="50" rx="4" fill="#2563eb"/>
      <rect x="16" y="0" width="16" height="50" rx="4" fill="#1e40af"/>
      <rect x="40" y="0" width="6" height="50" rx="3" fill="#2563eb"/>
      <rect x="54" y="0" width="12" height="50" rx="4" fill="#3b82f6"/>
      <rect x="74" y="0" width="18" height="50" rx="4" fill="#1e40af"/>
      <rect x="100" y="0" width="8" height="50" rx="4" fill="#2563eb"/>
      <rect x="116" y="0" width="14" height="50" rx="4" fill="#3b82f6"/>
      <rect x="138" y="0" width="8" height="50" rx="4" fill="#1e40af"/>
      <rect x="154" y="0" width="18" height="50" rx="4" fill="#2563eb"/>
      <rect x="180" y="0" width="12" height="50" rx="4" fill="#3b82f6"/>
    </g>

    <!-- Subtext inside bag: Arabic "أبو رامز" stylized -->
    <text x="256" y="345" font-family="'Cairo', 'IBM Plex Sans Arabic', sans-serif" font-weight="800" font-size="34" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">
      أبو رامز
    </text>

    <text x="256" y="380" font-family="'Cairo', 'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="16" fill="#64748b" text-anchor="middle">
      نظام المبيعات والجرد
    </text>
  </g>

  <!-- Notification Ping Badge in Top Corner -->
  <g transform="translate(390, 80)">
    <circle cx="20" cy="20" r="28" fill="#10b981" stroke="#ffffff" stroke-width="6"/>
    <!-- Checkmark Icon -->
    <path d="M 10 20 L 17 27 L 30 14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
